name: CI/CD Pipeline

on:
  push:
    branches: [ "develop", "main", "feature/course_project_5" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          # Остановит сборку, если есть синтаксические ошибки
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test with Django manage.py
        run: |
          # Подменяем переменные для тестов, чтобы не падало без БД
          export SECRET_KEY="test_secret"
          export DB_NAME="test_db"
          python manage.py test

  build-images:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image (Check)
        run: docker build -t mailing_service_web:latest .

  deploy:
    needs: build-images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' # Деплоим только при слиянии в develop
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/CourseProject_4
            git pull origin develop
            docker compose down
            docker compose up --build -d
            # Выполняем миграции внутри контейнера
            docker compose exec -T web python manage.py migrate
            docker compose exec -T web python manage.py create_manager_group