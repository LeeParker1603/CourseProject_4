{% extends 'mailing/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0">Подтверждение удаления сообщения</h5>
            </div>
            <div class="card-body text-center">
                <p class="fs-5">Вы уверены, что хотите удалить сообщение <strong>"{{ object.subject }}"</strong>?</p>
                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <a href="{% url 'mailing:message_list' %}" class="btn btn-secondary me-2">Отмена</a>
                    <button type="submit" class="btn btn-danger">Да, удалить</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
