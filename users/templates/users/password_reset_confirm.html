{% extends 'mailing/base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark text-center"><h4>Придумайте новый пароль</h4></div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100 mt-3">Сохранить новый пароль</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
